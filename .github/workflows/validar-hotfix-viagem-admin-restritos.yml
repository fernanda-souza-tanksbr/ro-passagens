name: Validar hotfix Viagem Administrativa restritos
on:
  push:
    branches:
      - hotfix/viagem-admin-restritos-prod-20261127
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Teste focado
        run: node --experimental-strip-types --test --test-isolation=none tests/viagemAdministrativaEligibility.test.ts
      - name: Typecheck e build
        run: npm run build
