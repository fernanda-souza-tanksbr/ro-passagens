name: Folga de Campo - testes SQL isolados

on:
  push:
    branches:
      - feat/folga-campo-regimes-distancia
    paths:
      - 'docs/sql/folga-campo-*.sql'
      - 'tests/sql/folgaCampo*.sql'
      - 'tests/sql/folgaCampo*.sh'
      - '.github/workflows/testar-folga-sql.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folga-sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-descartavel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste_descartavel
          POSTGRES_DB: folga_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d folga_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: teste_descartavel
      PGDATABASE: folga_teste
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar fixture e instalar pacote integrado atomico
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoFixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoPacoteIntegrado.sql

      - name: Conferir grants e RLS no pacote isolado
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoGrants.sql

      - name: Validar rollback e snapshots em transacoes reais
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoTransacoes.sql -f tests/sql/folgaCampoPermissoes.sql -f tests/sql/folgaCampoAprovacoes.sql

      - name: Validar regra real de folga futura duplicada
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoDuplicidadeReal.sql

      - name: Simular concorrencia entre duas transacoes
        run: bash tests/sql/folgaCampoConcorrencia.sh

      - name: Rejeitar permissao indeterminada de funcionario
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoPermissaoNula.sql
