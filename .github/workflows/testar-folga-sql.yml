name: Folga de Campo - testes SQL isolados

on:
  push:
    branches:
      - feat/folga-campo-regimes-distancia
    paths:
      - 'docs/sql/folga-campo-*.sql'
      - 'docs/implantacao/folga-campo-*.sql'
      - 'tests/sql/folgaCampo*.sql'
      - 'tests/sql/folgaCampo*.sh'
      - '.github/workflows/testar-folga-sql.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folga-sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-descartavel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste_descartavel
          POSTGRES_DB: folga_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d folga_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: teste_descartavel
      PGDATABASE: folga_teste
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar banco e instalar etapas A e B
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoFixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoLegadoRealFixture.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/implantacao/folga-campo-etapa-a-aditiva-RASCUNHO.sql
          psql -X -v ON_ERROR_STOP=1 -c "drop function public.ro_funcionario_possui_folga_futura_ativa(uuid,uuid)"
          psql -X -v ON_ERROR_STOP=1 -c "drop function public.ro_obter_ciclo_folga_funcionario(uuid)"
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoLegadoRealCaptura.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/implantacao/folga-campo-etapa-b-coordenada-RASCUNHO.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoMocksAposB.sql

      - name: Conferir grants e RLS no pacote isolado
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoGrants.sql

      - name: Validar rollback e snapshots em transacoes reais
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoTransacoes.sql -f tests/sql/folgaCampoPermissoes.sql -f tests/sql/folgaCampoAprovacoes.sql

      - name: Validar regra real de folga futura duplicada
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoDuplicidadeReal.sql

      - name: Simular concorrencia entre duas transacoes
        run: bash tests/sql/folgaCampoConcorrencia.sh

      - name: Rejeitar permissao indeterminada de funcionario
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoPermissaoNula.sql

      - name: Validar colaboradores privados com e sem vinculo
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoPrivados.sql

      - name: Testar bloqueio da RPC legada apos ativacao e rollback da flag
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoAtivacao.sql

      - name: Exercitar C1 C2 e reversao de permissoes no banco ficticio
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/implantacao/folga-campo-etapa-c1-permissoes-RASCUNHO.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/implantacao/folga-campo-etapa-c2-ativar-RASCUNHO.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoOperacaoPermissoes.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/implantacao/folga-campo-reversao-ativacao-RASCUNHO.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoGrants.sql
