name: Preparar DISTANCIA isolada (SHA homologado)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-distancia-approved
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_SqKFvMyAmjRyfIDwxZqJMJj3
      VERCEL_PROJECT_ID: prj_wkU8FwnRO2QqWzHfygeXUC289Jgs
      APPROVED_SHA: 14de85b0670c4be12faa9fa03c49abed23c438f2
    steps:
      - name: Check secret availability (no value disclosure)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is missing from repository Actions secrets."
            exit 1
          fi
          echo "VERCEL_TOKEN is configured."
      - name: Checkout approved source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 14de85b0670c4be12faa9fa03c49abed23c438f2
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
      - name: Install pinned CLI
        shell: bash
        run: npm install --global vercel@48.10.2
      - name: Link to existing Tanks project and pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APPROVED_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_C2 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=production --scope tanks --token "$VERCEL_TOKEN"
          # Install a pinned .env parser outside the checked-out repository.
          npm install --prefix /tmp/folga-dotenv --ignore-scripts --no-audit --no-fund --silent dotenv@16.4.5
          # Validate the public key against the approved Supabase Auth endpoint without logging its value.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --header "apikey: $APPROVED_PUBLISHABLE_KEY" 'https://hukhwirdrpylxpaedjbc.supabase.co/auth/v1/settings')"
          if [ "$status" != 200 ]; then echo "::error::Approved publishable key was not accepted by the expected Supabase Auth endpoint (HTTP $status)"; exit 1; fi
          echo "Approved publishable key accepted by expected Supabase project."
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import dotenv from '/tmp/folga-dotenv/node_modules/dotenv/lib/main.js';
          const expectedId = 'hukhwirdrpylxpaedjbc';
          const expectedUrl = 'https://hukhwirdrpylxpaedjbc.supabase.co';
          const project = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          if (project.orgId !== process.env.VERCEL_ORG_ID || project.projectId !== process.env.VERCEL_PROJECT_ID) {
            throw Error('Vercel team/project identity mismatch');
          }
          console.log('Vercel team/project identity: matching');
          const envFile = '.vercel/.env.production.local';
          const values = dotenv.parse(fs.readFileSync(envFile));
          const expectedKey = process.env.APPROVED_PUBLISHABLE_KEY || '';
          if (!/^sb_publishable_[A-Za-z0-9_-]+$/.test(expectedKey) || /\\[SENSITIVE\\]/i.test(expectedKey)) throw Error('Approved publishable secret missing or invalid format');
          const url = new URL('https://hukhwirdrpylxpaedjbc.supabase.co');
          if (url.origin !== 'https://hukhwirdrpylxpaedjbc.supabase.co') throw Error('Approved Supabase URL mismatch');
          const exported = ['VITE_SUPABASE_URL','VITE_SUPABASE_PROJECT_ID','VITE_SUPABASE_PUBLISHABLE_KEY'].map(key => {
            const v = values[key];
            return key + ': ' + (v === undefined ? 'absent' : !v || /^\\[SENSITIVE\\]$/i.test(v) ? 'empty or protected' : 'provided');
          });
          exported.forEach(line => console.log('Vercel export ' + line));
          const unsafe = Object.keys(values).filter(k => /^VITE_/.test(k) && /(SERVICE_ROLE|SECRET|PRIVATE|JWT_SECRET)/i.test(k));
          if (unsafe.length) throw Error('Unsafe VITE-prefixed variable names found; refusing frontend build');
          values.VITE_SUPABASE_URL = url.origin;
          values.VITE_SUPABASE_PROJECT_ID = 'hukhwirdrpylxpaedjbc';
          values.VITE_SUPABASE_PUBLISHABLE_KEY = expectedKey;
          values.VITE_FOLGA_CAMPO_KM_ENABLED = 'C2_PRODUCAO_APROVADA';
          if (values.VITE_SUPABASE_URL !== url.origin || values.VITE_SUPABASE_PROJECT_ID !== 'hukhwirdrpylxpaedjbc' || values.VITE_SUPABASE_PUBLISHABLE_KEY !== expectedKey || values.VITE_FOLGA_CAMPO_KM_ENABLED !== 'C2_PRODUCAO_APROVADA') throw Error('Build identity validation failed');
          const output = Object.entries(values).map(([key,value]) => key + '=' + JSON.stringify(value)).join('\\n') + '\\n';
          fs.writeFileSync(envFile, output, {mode:0o600});
          console.log('Production build env prepared with approved public identifiers, validated publishable key and C2 gate value; values redacted.');
          NODE
      - name: Build approved source with production VITE variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          vercel build --prod --scope tanks --token "$VERCEL_TOKEN"
      - name: Stage production deployment without aliases
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --skip-domain --scope tanks --token "$VERCEL_TOKEN" --meta approvedCommit="$APPROVED_SHA")"
          DEPLOYMENT_URL="$url" node --input-type=module -e '
            const url = process.env.DEPLOYMENT_URL;
            const u = new URL(url);
            if (u.protocol !== "https:" || u.origin !== url || !u.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
      - name: Verify READY, approved SHA marker, and zero operational aliases
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          hostname="${DEPLOYMENT_URL#https://}"
          for attempt in $(seq 1 20); do
            response="$(curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$hostname?teamId=$VERCEL_ORG_ID")"
            state="$(jq -r '.readyState // .state // empty' <<< "$response")"
            if [ "$state" = READY ]; then break; fi
            if [ "$state" = ERROR ] || [ "$state" = CANCELED ]; then echo "::error::Deployment failed: $state"; exit 1; fi
            sleep 10
          done
          test "$state" = READY
          deployment_id="$(jq -r '.id' <<< "$response")"
          test "$(jq -r '.meta.approvedCommit // empty' <<< "$response")" = "$APPROVED_SHA"
          aliases="$(curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/deployments/$deployment_id/aliases?teamId=$VERCEL_ORG_ID")"
          if jq -e '[.aliases[]?.alias] | any(. == "ro-passagens.vercel.app" or . == "portal-tks-br.vercel.app" or . == "portal-tks-br-tanks.vercel.app" or . == "portal-tks-br-git-main-tanks.vercel.app")' <<< "$aliases" | grep -q true; then
            echo "::error::Operational alias was assigned"; exit 1
          fi
          {
            echo "## Isolated DISTANCIA deployment"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Deployment ID: $deployment_id"
            echo "- Status: READY"
            echo "- Approved source SHA: $APPROVED_SHA"
            echo "- Supabase: production project verified at build time (no writes performed)"
            echo "- Operational aliases: none assigned"
            echo "- SQL, suspension, and promotion: not executed"
          } >> "$GITHUB_STEP_SUMMARY"
