name: Validar release Folga Semanal frontend (sem publicacao)
on:
  push:
    branches:
      - release/folga-semanal-frontend-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verificar que a branch de preparacao nao ativa modo DISTANCIA por engano
        run: |
          test "$(node -p "require('./public/folga-campo-release.json').modo")" = legado
      - name: Simular artefato DISTANCIA sem acessar producao
        env:
          VITE_FOLGA_CAMPO_KM_ENABLED: C2_PRODUCAO_APROVADA
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('public/folga-campo-release.json', JSON.stringify({modo:'distancia',versao_minima:2})+'\\n')"
          npm run build
          test "$(node -p "require('./dist/folga-campo-release.json').modo")" = distancia
          echo "PASS: build DISTANCIA preparado apenas em CI, sem deployment."
