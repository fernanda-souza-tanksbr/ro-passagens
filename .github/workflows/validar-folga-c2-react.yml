name: Folga C2 - React real e Auth HTTP simulada isolada
on:
  push:
    branches:
      - feat/folga-campo-regimes-distancia
    paths:
      - 'src/**'
      - 'tests/e2e/folgaCampoReactIntegrado.spec.ts'
      - '.github/workflows/validar-folga-c2-react.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folga-c2-react
  cancel-in-progress: true
jobs:
  react-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      VITE_SUPABASE_URL: http://127.0.0.1:4174
      VITE_SUPABASE_PUBLISHABLE_KEY: mock_public_publishable_key_no_real_credentials
      VITE_FOLGA_CAMPO_KM_ENABLED: C2_PRODUCAO_APROVADA
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar pacotes no runner
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Compilar o React verdadeiro, sempre apontado para loopback
        run: |
          test "$VITE_SUPABASE_URL" = "http://127.0.0.1:4174"
          npm run build
          if grep -rE '(hukhwirdrpylxpaedjbc|supabase[.]co)' dist/assets/*.js; then
            echo "HALT: bundle referencia Supabase externo"
            exit 1
          fi
      - name: Servir React sem backend real
        run: |
          npm run dev -- --host 127.0.0.1 --port 4174 > /tmp/vite-c2.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite-c2.log
          exit 1
      - name: Playwright Auth+RPC simulados no React real
        run: |
          npx playwright test tests/e2e/folgaCampoReactIntegrado.spec.ts --workers=1 --browser=chromium --reporter=list
