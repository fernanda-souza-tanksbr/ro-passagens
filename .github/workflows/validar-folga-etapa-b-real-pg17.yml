name: Folga de Campo - homologacao Etapa B com funcoes reais PG17

on:
  push:
    branches:
      - feat/folga-campo-regimes-distancia
    paths:
      - 'docs/implantacao/folga-campo-etapa-b-coordenada-RASCUNHO.sql'
      - 'docs/implantacao/folga-campo-etapa-a-aditiva-RASCUNHO.sql'
      - 'tests/sql/folgaCampoLegadoReal*.sql'
      - 'tests/sql/folgaCampoEtapaBRealRegressao.sql'
      - '.github/workflows/validar-folga-etapa-b-real-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folga-etapa-b-real-pg17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legado-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste_descartavel
          POSTGRES_DB: folga_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d folga_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: teste_descartavel
      PGDATABASE: folga_teste
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar PostgreSQL 17 e dados ficticios
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atc "show server_version" | grep -E '^17[.]'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoFixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoLegadoRealFixture.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/implantacao/folga-campo-etapa-a-aditiva-RASCUNHO.sql
      - name: Instalar definicoes REAIS dos controles legados no banco temporario
        run: |
          # Remover exclusivamente as duas funcoes ficticias cujos nomes de parametros
          # nao coincidem com os da producao. As dependencias da Etapa A ja foram validadas.
          psql -X -v ON_ERROR_STOP=1 -c "drop function public.ro_funcionario_possui_folga_futura_ativa(uuid,uuid)"
          psql -X -v ON_ERROR_STOP=1 -c "drop function public.ro_obter_ciclo_folga_funcionario(uuid)"
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoLegadoRealCaptura.sql
          psql -X -v ON_ERROR_STOP=1 -Atc "select md5(pg_get_functiondef('public.ro_validar_ciclo_folga_campo()'::regprocedure))" | grep '^49a68dd1572810e5a18a996cd901df9e$'
          psql -X -v ON_ERROR_STOP=1 -Atc "select md5(pg_get_functiondef('public.ro_auditar_ciclo_folga_campo()'::regprocedure))" | grep '^589eb30a46581641c8bedf80e3d5e50e$'
      - name: Guardar funcao legado e estado do gate
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atc "select pg_get_functiondef('public.ro_obter_ciclo_folga_funcionario(uuid)'::regprocedure)" > /tmp/ciclo_antes.sql
          psql -X -v ON_ERROR_STOP=1 -Atc "select pg_get_functiondef('public.ro_bloquear_compra_antecipacao_pendente()'::regprocedure)" > /tmp/compra_antes.sql
      - name: Aplicar SOMENTE a etapa B no banco temporario
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/implantacao/folga-campo-etapa-b-coordenada-RASCUNHO.sql
          test "$(psql -X -v ON_ERROR_STOP=1 -Atc "select ativo from ro_private.folga_configuracao where chave='novo_fluxo_distancia'")" = "f"
          psql -X -v ON_ERROR_STOP=1 -Atc "select pg_get_functiondef('public.ro_obter_ciclo_folga_funcionario(uuid)'::regprocedure)" > /tmp/ciclo_depois.sql
          diff -u /tmp/ciclo_antes.sql /tmp/ciclo_depois.sql
          psql -X -v ON_ERROR_STOP=1 -Atc "select pg_get_functiondef('public.ro_bloquear_compra_antecipacao_pendente()'::regprocedure)" > /tmp/compra_depois.sql
          diff -u /tmp/compra_antes.sql /tmp/compra_depois.sql
      - name: Validar operacoes com codigo legado real e controles integrados
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/folgaCampoEtapaBRealRegressao.sql
