name: Validate combined RO release PR6 and KM (no deploy)
on:
  push:
    branches:
      - release/ro-pr6-km-integrado-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Record integration state without deploying
        run: |
          echo "SHA: $(git rev-parse HEAD)"
          test -f supabase/manual/20261119_restringir_viagem_administrativa_NAO_APLICAR.sql
          test -f src/CorrecaoQuilometragemFolga.tsx
          test -f src/folgaCampoPlanejamento.ts
          test -f src/viagemAdministrativaEligibility.ts
          echo "Validation only; production unchanged"
