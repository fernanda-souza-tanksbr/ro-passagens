name: Validar correcao quilometragem Folga Campo (sem publicacao)
on:
  push:
    branches:
      - feat/ro-correcao-quilometragem-folga-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Confirmar que nenhum deploy ou alteracao da flag sera realizado
        run: |
          test "$(node -p "require('./public/folga-campo-release.json').modo")" = legado
